[project]
name = "jobranker"
version = "0.1.0"
description = "Analyze and rank job offers against your CV (LinkedIn-ToS-safe, human-in-the-loop)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
pdf = ["pypdf>=3.0"]
dev = ["pytest>=7.0"]

[project.scripts]
jobranker = "jobranker.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobranker*"]
